  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, createContext, useContext } = React;

    // ==========================================

      return ({ size = 20, color = "currentColor", className = "", style = {} }) => (
        <svg width={size} height={size} viewBox={viewBox} fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className} style={{ display: 'inline-block', verticalAlign: 'middle', flexShrink: 0, ...style }}>
          {pathElements}

    };

    const Droplets = createSvgIcon(<><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.09 3 12.25c0 2.22 1.8 4.05 4 4.05z" /><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 1.5 1.5 2.7 2.5 3.5 1.5 1.2 2.5 2.7 2.5 4.48 0 2.76-2.24 5-5 5s-5-2.24-5-5c0-1.28.48-2.43 1.34-3.32" /></>);

    const Wrench = createSvgIcon(<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />);

    const Layers = createSvgIcon(<><polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" /></>);
    const Folder = createSvgIcon(<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z" />);
    const Download = createSvgIcon(<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></>);
    const Check = createSvgIcon(<polyline points="20 6 9 17 4 12" />);
    const LogOut = createSvgIcon(<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></>);
    const Zap = createSvgIcon(<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />);
    const Leaf = createSvgIcon(<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />);
    const X = createSvgIcon(<><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>);
    const Loader2 = createSvgIcon(<path d="M21 12a9 9 0 1 1-6.219-8.56" />);

    // ==========================================
    // CONSTANTS & PRESETS
    // ==========================================
    const DEMO_USERS = [
      {
        id: "usr-1",
        name: "Akshat Kanchan",
        email: "akshat.kanchan@mpgi.edu.in",
        role: "Student Researcher (BCA)",
        institution: "Maharana Pratap Group of Professional Studies",
        location: "Kanpur, UP",
        avatarInitial: "AK"
      },
      {
        id: "usr-2",
        name: "Dr. S. Sharma",
        email: "principal@mpgi.edu.in",
        role: "Campus Director / Faculty",
        institution: "Maharana Pratap Campus",
        location: "Kanpur, UP",
        avatarInitial: "SS"
      },
      {
        id: "usr-3",
        name: "Vikram Singh",
        email: "vikram@kisanwater.in",
        role: "RWH Contractor & Dealer",
        institution: "Kisan Water Technologies",
        location: "Lucknow, UP",
        avatarInitial: "VS"
      },
      {
        id: "usr-4",

        email: "ramesh.farmer@agro.in",
        role: "Farm & Land Owner",

    const CITIES_WEATHER = [
      { id: "kanpur", name: "Kanpur, UP", rainfall: 900, condition: "🌧️ Active Monsoon (34 mm/hr)", temp: "29°C", status: "rainy" },
      { id: "lucknow", name: "Lucknow, UP", rainfall: 950, condition: "⛈️ Thunderstorm Alert (42 mm/hr)", temp: "28°C", status: "storm" },
      { id: "delhi", name: "Delhi NCR", rainfall: 750, condition: "⛅ Partly Cloudy (8 mm/hr)", temp: "32°C", status: "cloudy" },
      { id: "varanasi", name: "Varanasi, UP", rainfall: 1050, condition: "🌧️ Heavy Downpour (48 mm/hr)", temp: "27°C", status: "rainy" },
      { id: "mumbai", name: "Mumbai, MH", rainfall: 2200, condition: "🌊 Torrential Coastal Rain", temp: "28°C", status: "heavy" },
      { id: "bengaluru", name: "Bengaluru, KA", rainfall: 850, condition: "🌦️ Intermittent Showers", temp: "24°C", status: "rainy" },
      { id: "jaipur", name: "Jaipur, RJ", rainfall: 550, condition: "☀️ Dry & Sunny", temp: "35°C", status: "sunny" }
    ];

    const DEFAULT_SAVED_PROJECTS = [
      {
        id: "proj-1",
        name: "Maharana Pratap Group Campus",
        type: "Academic Institution",
        area: 2500,
        rainfall: 900,
        date: "2026-08-25",
        annualYield: 1912500,
        status: "Verified BIS IS 15797"
      },
      {
        id: "proj-2",
        name: "Green Valley Agriculture Shed",
        type: "Farming & Warehouse",
        area: 1200,
        rainfall: 950,
        date: "2026-08-20",
        annualYield: 969000,
        status: "Active Field Audit"
      },
      {
        id: "proj-3",
        name: "Urban Polytechnic Science Block",
        type: "Technical College",
        area: 3200,
        rainfall: 820,
        date: "2026-08-15",
        annualYield: 2230400,
        status: "Proposal Stage"
      }
    ];

    const FARM_PRESETS = [
      { id: "shed", name: "🏡 Small Shed / House", areaSqFt: 500, areaM2: 46 },
      { id: "medium", name: "🌾 Medium Barn / Shed", areaSqFt: 2000, areaM2: 185 },
      { id: "large", name: "🏭 Large Farm Storage", areaSqFt: 5000, areaM2: 465 },
      { id: "greenhouse", name: "🏬 Greenhouse / Campus", areaSqFt: 10000, areaM2: 930 }
    ];

    const KISAN_PROMPTS = [
      "🌾 What is the lowest-cost filter for farm rainwater?",
      "🛢️ How much water tank capacity do I need for 4 people?",
      "🚿 How do I build a simple DIY first-flush pipe?",
      "💧 How much rainwater can I harvest from 2,000 sq ft roof?",
      "⚡ How much electricity money can I save by recharging ground borewells?"
    ];

    const DEFAULT_CHAT = [
      { id: "m-1", sender: "assistant", text: "Namaste! I am Kisan AI, your smart water advisor. Ask me anything about rainwater harvesting, tank sizing, filter designs, or borewell artificial recharge!" }
    ];

    // ==========================================
    // MAIN APP CONTEXT
    // ==========================================
    const AppContext = createContext();

    const AppProvider = ({ children }) => {
      // User Auth State
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem("aquaharvest_user");
        return saved ? JSON.parse(saved) : DEMO_USERS[0];
      });
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [showProfileModal, setShowProfileModal] = useState(false);
      const [showProjectsModal, setShowProjectsModal] = useState(false);

      // Mode & Navigation
      const [appMode, setAppMode] = useState('academic'); // 'academic' | 'farmer'
      const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard', 'survey', 'calc', 'schematic', 'cost', 'iot', 'report', 'farmer_calc', 'dealer_quote', 'kisan_ai'
      const [theme, setTheme] = useState('farmer-light');

      // Site Assessment Data (Academic Mode)
      const [siteData, setSiteData] = useState({
        campusName: "Maharana Pratap Group of Professional Studies",
        buildingName: "Main Academic & Administrative Block",
        surveyor: "Akshat Kanchan (BCA 2026)",
        area: 2500, // m²
        rainfall: 900, // mm
        material: "rcc", // 'rcc', 'metal', 'tiles'
        soilType: "sandy_loam",
        dailyDemand: 5500, // L/day
        waterTariffRate: 45 // INR / kL
      });

      // Quick Calculator State (Farmer Mode)
      const [roofSqFt, setRoofSqFt] = useState(2000);
      const [farmerRainfall, setFarmerRainfall] = useState(900);
      const [familySize, setFamilySize] = useState(4);
      const [selectedFarmPreset, setSelectedFarmPreset] = useState('medium');

      // Dealer Quote State
      const [quoteConfig, setQuoteConfig] = useState({
        tankCapacity: 5000,
        pipeLength: 35,
        filterType: 'diverter_sediment'
      });

      // IoT & Live Sensor Simulation State
      const [selectedCity, setSelectedCity] = useState(CITIES_WEATHER[0]);
      const [isStormActive, setIsStormActive] = useState(false);
      const [tankWaterLevelPct, setTankWaterLevelPct] = useState(72);
      const [solenoidValveOpen, setSolenoidValveOpen] = useState(true);
      const [submersiblePumpOn, setSubmersiblePumpOn] = useState(false);
      const [turbidityNtu, setTurbidityNtu] = useState(2.4);
      const [waterTableMeters, setWaterTableMeters] = useState(21.4);

      // Saved Projects
      const [savedProjects, setSavedProjects] = useState(() => {
        const saved = localStorage.getItem("aquaharvest_projects");
        return saved ? JSON.parse(saved) : DEFAULT_SAVED_PROJECTS;
      });

      // Chat Messages
      const [messages, setMessages] = useState(DEFAULT_CHAT);
      const [isGenerating, setIsGenerating] = useState(false);

      // Sync User & Theme
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
      }, [theme]);

      useEffect(() => {
        localStorage.setItem("aquaharvest_user", JSON.stringify(currentUser));
      }, [currentUser]);

      useEffect(() => {
        localStorage.setItem("aquaharvest_projects", JSON.stringify(savedProjects));
      }, [savedProjects]);

      // Calculations for Academic Mode
      const academicResults = useMemo(() => {
        const coeffMap = { rcc: 0.85, metal: 0.90, tiles: 0.75 };
        const coeff = coeffMap[siteData.material] || 0.85;
        const filterEff = 0.90;

        // Annual Yield in Liters: Area (m²) * Rainfall (m) * Coeff * FilterEff * 1000
        const annualYield = Math.round(siteData.area * (siteData.rainfall / 1000) * coeff * filterEff * 1000);
        const storageVolume = Math.round(annualYield * 0.30);
        const rechargeVolume = Math.round(annualYield * 0.70);
        const firstFlushVolume = Math.round(siteData.area * 1.5); // 1.5 mm dirt wash = 1.5 L/m²
        const peakDischargeLps = ((coeff * 50 * siteData.area) / 3600).toFixed(1); // 50 mm/hr peak

        // Financials
        const annualSavings = Math.round((annualYield / 1000) * siteData.waterTariffRate);
        const estimatedCapex = 245000;
        const paybackYears = (estimatedCapex / annualSavings).toFixed(2);

        // Environmental Impact
        const co2AvoidedKg = Math.round((annualYield / 1000) * 1.4); // 1.4 kg CO2 per kL pumped
        const demandOffsetPct = Math.min(100, Math.round((annualYield / (siteData.dailyDemand * 300)) * 100));

        return {
          annualYield,
          storageVolume,
          rechargeVolume,
          firstFlushVolume,
          peakDischargeLps,
          annualSavings,
          estimatedCapex,
          paybackYears,
          co2AvoidedKg,
          demandOffsetPct,
          coeff
        };
      }, [siteData]);

      // Calculations for Farmer Mode
      const farmerResults = useMemo(() => {
        const roofM2 = Math.round(roofSqFt / 10.764);
        const annualYieldLiters = Math.round(roofM2 * (farmerRainfall / 1000) * 0.85 * 1000);
        const recommendedTankLiters = Math.max(1000, Math.round(annualYieldLiters * 0.18));
        const moneySaved = Math.round((annualYieldLiters / 1000) * 40);
        const autonomyDays = Math.round(recommendedTankLiters / (familySize * 135));

        return {
          roofM2,
          annualYieldLiters,
          recommendedTankLiters,
          moneySaved,
          autonomyDays
        };
      }, [roofSqFt, farmerRainfall, familySize]);

      // Dealer Pricing Computation
      const dealerQuote = useMemo(() => {
        const tankPrices = { 1000: 8500, 2000: 16000, 5000: 34000, 10000: 65000, 20000: 120000 };
        const filterPrices = { basic: 4500, diverter_sediment: 12500, uv_purifier: 28000 };
        const pipePricePerMeter = 240;

        const tankCost = tankPrices[quoteConfig.tankCapacity] || Math.round(quoteConfig.tankCapacity * 7);
        const pipeCost = quoteConfig.pipeLength * pipePricePerMeter;
        const filterCost = filterPrices[quoteConfig.filterType] || 12500;
        const laborCost = Math.round((tankCost + pipeCost + filterCost) * 0.18);
        const total = tankCost + pipeCost + filterCost + laborCost;

        return { tankCost, pipeCost, filterCost, laborCost, total };
      }, [quoteConfig]);

      // Handle Storm Simulator
      const triggerStormSimulation = () => {
        setIsStormActive(true);
        setTurbidityNtu(6.8); // trigger filter alert
        setTankWaterLevelPct(94);
        setWaterTableMeters(prev => Math.max(18.0, +(prev - 0.4).toFixed(1)));

        setTimeout(() => {
          setIsStormActive(false);
          setTurbidityNtu(2.1);
        }, 5000);
      };

      // Handle Saving Current Project
      const saveCurrentProject = () => {
        const newProj = {
          id: `proj-${Date.now()}`,
          name: siteData.campusName,
          type: "Rooftop Rainwater Assessment",
          area: siteData.area,
          rainfall: siteData.rainfall,
          date: new Date().toISOString().split('T')[0],
          annualYield: academicResults.annualYield,
          status: "Saved by " + currentUser.name
        };
        setSavedProjects(prev => [newProj, ...prev]);
        alert("Project assessment saved to your account successfully!");
      };

      // Handle Chat
      const handleSendMessage = (text) => {
        if (!text.trim() || isGenerating) return;
        setMessages(prev => [...prev, { id: `m-${Date.now()}`, sender: "user", text }]);
        setIsGenerating(true);

        setTimeout(() => {
          let reply = `Namaste ${currentUser.name}! Based on your current site configuration:\n- **Catchment Area**: ${siteData.area} m² (${(siteData.area * 10.764).toFixed(0)} sq ft)\n- **Annual Rainwater Yield**: **${academicResults.annualYield.toLocaleString()} Liters** (~${(academicResults.annualYield/100000).toFixed(2)} Lakh Liters)\n- **Demand Offset**: ${academicResults.demandOffsetPct}%\n- **Estimated Payback**: **${academicResults.paybackYears} Years**.\n\nDual-media reverse sand filtration and slotted injection wells are strongly recommended under BIS IS 15797:2008.`;

          if (text.toLowerCase().includes('filter') || text.toLowerCase().includes('cost')) {
            reply = `For cost-effective institutional & farm filtration:\n1. **Stainless Steel Leaf Strainer**: ₹1,800\n2. **Automated First-Flush Floating Chamber**: ₹2,500\n3. **Dual-Media Sand + Activated Charcoal Filter Bed**: ₹14,000\n\nThis captures >92% of suspended sediment and keeps borewells free of clogging!`;
          } else if (text.toLowerCase().includes('recharge') || text.toLowerCase().includes('borewell')) {
            reply = `For artificial groundwater recharge in alluvial soils (water table at ${waterTableMeters}m bgl):\n- Drill a **150 mm slotted PVC casing** to 24m depth.\n- Surround with graded gravel pack ($15-30 mm$).\n- Feed filtered overflow from the storage cistern to achieve up to **1.2 Million Liters of direct aquifer recharge** per monsoon!`;
          }

          setMessages(prev => [...prev, { id: `m-${Date.now() + 1}`, sender: "assistant", text: reply }]);
          setIsGenerating(false);
        }, 800);
      };

      return (
        <AppContext.Provider value={{
          currentUser, setCurrentUser,
          showAuthModal, setShowAuthModal,
          showProfileModal, setShowProfileModal,
          showProjectsModal, setShowProjectsModal,
          appMode, setAppMode,
          activeTab, setActiveTab,
          theme, setTheme,
          siteData, setSiteData,
          academicResults,
          roofSqFt, setRoofSqFt,
          farmerRainfall, setFarmerRainfall,
          familySize, setFamilySize,
          selectedFarmPreset, setSelectedFarmPreset,
          farmerResults,
          quoteConfig, setQuoteConfig,
          dealerQuote,
          selectedCity, setSelectedCity,
          isStormActive, triggerStormSimulation,
          tankWaterLevelPct, setTankWaterLevelPct,
          solenoidValveOpen, setSolenoidValveOpen,
          submersiblePumpOn, setSubmersiblePumpOn,
          turbidityNtu,
          waterTableMeters,
          savedProjects, setSavedProjects,
          saveCurrentProject,
          messages, handleSendMessage, isGenerating
        }}>
          {children}
        </AppContext.Provider>
      );
    };

    const useApp = () => useContext(AppContext);

    // ==========================================
    // SIDEBAR NAVIGATION
    // ==========================================
    const Sidebar = () => {
      const { appMode, setAppMode, activeTab, setActiveTab, savedProjects, setShowProjectsModal } = useApp();

      const academicNav = [
        { id: 'dashboard', label: '1. Executive Dashboard', icon: Activity },
        { id: 'survey', label: '2. On-Spot Field Survey', icon: Wrench },
        { id: 'calc', label: '3. Hydro Calculation Engine', icon: Calculator },
        { id: 'schematic', label: '4. Interactive 2D/3D Schematic', icon: Layers },
        { id: 'cost', label: '5. Cost, BOQ & ROI Analyzer', icon: Zap },
        { id: 'iot', label: '6. Smart IoT & Sensor Telemetry', icon: CloudRain },
        { id: 'report', label: '7. 20-Chapter Synopsis & Docs', icon: BookOpen }
      ];

      const farmerNav = [
        { id: 'farmer_calc', label: '1. Quick Farm & Shed Calculator', icon: Calculator },
        { id: 'dealer_quote', label: '2. Dealer Quotation & Invoice', icon: Wrench },
        { id: 'kisan_ai', label: '3. Kisan AI Water Assistant', icon: Bot }
      ];

      const navList = appMode === 'academic' ? academicNav : farmerNav;

      return (
        <aside className="sidebar">
          <div>
            <div className="brand-container">
              <div className="brand-icon"><Droplets size={26} color="#ffffff" /></div>
              <div>
                <h1 className="brand-title">AquaHarvest</h1>
                <span style={{ fontSize: '0.78rem', color: 'var(--text-muted)', fontWeight: '700' }}>
                  {appMode === 'academic' ? '🎓 College & Engineering Suite' : '🚜 Farmer & Dealer App'}
                </span>
              </div>
            </div>

            {/* Mode Switcher Banner */}
            <div className="mode-toggle-box">
              <button 
                className={`mode-toggle-btn ${appMode === 'academic' ? 'active' : ''}`}
                onClick={() => { setAppMode('academic'); setActiveTab('dashboard'); }}
              >
                <span>🎓 Academic</span>
              </button>
              <button 
                className={`mode-toggle-btn ${appMode === 'farmer' ? 'active' : ''}`}

                  key={p.id} 
                  className={`farm-preset-btn ${selectedFarmPreset === p.id ? 'selected' : ''}`}
                  onClick={() => { setSelectedFarmPreset(p.id); setRoofSqFt(p.areaSqFt); }}
                >
                  <span>{p.name}</span>
                  <span style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>{p.areaSqFt.toLocaleString()} sq ft</span>
                </button>
              ))}
            </div>
          </div>

          <div className="kpi-row">
            <div className="kpi-card">
              <span className="kpi-label">Annual Rain Harvest</span>
              <span className="kpi-value">{farmerResults.annualYieldLiters.toLocaleString()} L</span>
              <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)', fontWeight: '600' }}>Free water per year</span>
            </div>

            <div className="kpi-card">
              <span className="kpi-label">Recommended Tank Size</span>
              <span className="kpi-value" style={{ color: 'var(--accent-emerald)' }}>{farmerResults.recommendedTankLiters.toLocaleString()} L</span>
              <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)', fontWeight: '600' }}>Storage Tank</span>
            </div>

            <div className="kpi-card">
              <span className="kpi-label">Annual Money Saved</span>
              <span className="kpi-value" style={{ color: 'var(--accent-amber)' }}>₹{farmerResults.moneySaved.toLocaleString()}</span>
              <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)', fontWeight: '600' }}>~{farmerResults.autonomyDays} Days backup supply</span>
            </div>
          </div>

          <div className="calc-grid">
            <div className="metric-card">
              <div style={{ fontSize: '1.05rem', fontWeight: '700', color: 'var(--accent-primary)' }}>
                STEP 2: ADJUST MEASUREMENTS
              </div>

              <div className="form-group">
                <div className="form-label">
                  <span>Roof Catchment Area</span>
                  <span style={{ color: 'var(--accent-primary)', fontWeight: '800' }}>{roofSqFt.toLocaleString()} sq ft ({farmerResults.roofM2} m²)</span>
                </div>
                <input type="range" min="300" max="15000" step="100" className="range-slider" value={roofSqFt} onChange={e => setRoofSqFt(+e.target.value)} />
              </div>

              <div className="form-group">
                <label className="form-label">Rainfall Zone</label>
                <select className="form-select" value={farmerRainfall} onChange={e => setFarmerRainfall(+e.target.value)}>
                  <option value="450">Dry / Low Rain (450 mm/yr)</option>
                  <option value="900">Moderate Rain (900 mm/yr)</option>
                  <option value="1800">Heavy Monsoon / Coastal (1800 mm/yr)</option>
                </select>
              </div>

              <div className="form-group">
                <div className="form-label">
                  <span>Family / Farm Members</span>
                  <span style={{ color: 'var(--accent-primary)', fontWeight: '800' }}>{familySize} Persons</span>
                </div>
                <input type="range" min="1" max="25" step="1" className="range-slider" value={familySize} onChange={e => setFamilySize(+e.target.value)} />
              </div>
            </div>

            <div className="metric-card">
              <div style={{ fontSize: '1.05rem', fontWeight: '700', color: 'var(--accent-emerald)' }}>
                WATER TANK LEVEL PREVIEW
              </div>

              <div className="tank-meter-box">
                <div className="tank-water-fill" style={{ height: '75%' }}></div>
                <div className="tank-label-text">
                  {farmerResults.recommendedTankLiters.toLocaleString()} L
                  <div style={{ fontSize: '0.85rem', fontWeight: '600' }}>Recommended Capacity</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // FARMER TAB 2: DEALER QUOTATION GENERATOR
    // ==========================================
    const DealerQuoteView = () => {
      const { quoteConfig, setQuoteConfig, dealerQuote } = useApp();

      return (
        <div className="fade-in">
          <div className="calc-grid">
            <div className="metric-card">
              <h3 style={{ fontSize: '1.15rem', fontWeight: '800', color: 'var(--accent-primary)' }}>
                ⚙️ Configure Quotation Package
              </h3>

              <div className="form-group">
                <label className="form-label">Water Tank Storage Capacity</label>
                <select className="form-select" value={quoteConfig.tankCapacity} onChange={e => setQuoteConfig({ ...quoteConfig, tankCapacity: +e.target.value })}>
                  <option value="1000">1,000 Liters (Small Shed)</option>
                  <option value="2000">2,000 Liters (Medium House)</option>
                  <option value="5000">5,000 Liters (Standard Farm)</option>
                  <option value="10000">10,000 Liters (Commercial Barn)</option>
                  <option value="20000">20,000 Liters (Campus / High Yield)</option>
                </select>
              </div>

              <div className="form-group">
                <div className="form-label">
                  <span>Piping & Gutter Length</span>
                  <span style={{ fontWeight: '800', color: 'var(--accent-primary)' }}>{quoteConfig.pipeLength} Meters</span>
                </div>
                <input type="range" min="10" max="150" step="5" className="range-slider" value={quoteConfig.pipeLength} onChange={e => setQuoteConfig({ ...quoteConfig, pipeLength: +e.target.value })} />
              </div>

              <div className="form-group">
                <label className="form-label">Filtration Unit Level</label>
                <select className="form-select" value={quoteConfig.filterType} onChange={e => setQuoteConfig({ ...quoteConfig, filterType: e.target.value })}>
                  <option value="basic">Basic Mesh Strainer (Leaves/Debris)</option>
                  <option value="diverter_sediment">First-Flush + Dual Sand Filter (Standard)</option>
                  <option value="uv_purifier">Full Ultra-Filtration + UV Disinfection</option>
                </select>
              </div>
            </div>

            <div className="quote-box">
              <div style={{ display: 'flex', justifyContent: 'space-between', borderBottom: '2px solid var(--border-glass)', paddingBottom: '0.75rem', marginBottom: '1rem' }}>
                <div>
                  <h3 style={{ fontSize: '1.2rem', fontWeight: '800' }}>Official Price Quotation</h3>
                  <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>AquaHarvest Dealer Network</span>
                </div>
                <button className="action-btn primary" onClick={() => window.print()}>
                  <Printer size={16} />
                  <span>Print Invoice</span>
                </button>
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', gap: '0.65rem', fontSize: '0.95rem' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                  <span>HDPE Storage Tank ({quoteConfig.tankCapacity.toLocaleString()} L):</span>
                  <strong>₹{dealerQuote.tankCost.toLocaleString()}</strong>
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                  <span>Conveyance Piping & Gutters ({quoteConfig.pipeLength} m):</span>
                  <strong>₹{dealerQuote.pipeCost.toLocaleString()}</strong>
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                  <span>Filtration System Package:</span>
                  <strong>₹{dealerQuote.filterCost.toLocaleString()}</strong>
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                  <span>Installation, Civil Work & Labor:</span>
                  <strong>₹{dealerQuote.laborCost.toLocaleString()}</strong>
                </div>

                <div style={{ borderTop: '2px solid var(--accent-primary)', paddingTop: '0.75rem', marginTop: '0.5rem', display: 'flex', justifyContent: 'space-between', fontSize: '1.25rem', fontWeight: '800', color: 'var(--accent-primary)' }}>
                  <span>ESTIMATED TOTAL:</span>
                  <span>₹{dealerQuote.total.toLocaleString()}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // FARMER TAB 3: KISAN AI ASSISTANT
    // ==========================================
    const KisanAIChatView = () => {
      const { messages, handleSendMessage, isGenerating } = useApp();
      const [input, setInput] = useState('');
      const chatEndRef = useRef(null);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, isGenerating]);

      const onSend = () => {
        if (!input.trim() || isGenerating) return;
        handleSendMessage(input);
        setInput('');
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          onSend();
        }
      };

      return (
        <div className="chat-container fade-in">
          <div className="chat-messages">
            {messages.map(m => (
              <div key={m.id} className={`message-row ${m.sender}`}>
                <div className="avatar-box">
                  {m.sender === 'user' ? '👤' : '🤖'}
                </div>
                <div className="message-bubble" style={{ whiteSpace: 'pre-line' }}>
                  {m.text}
                </div>
              </div>
            ))}

            {isGenerating && (
              <div className="message-row assistant">
                <div className="avatar-box">🤖</div>
                <div className="message-bubble" style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                  <Loader2 size={16} className="spinSlow" />
                  <span>Kisan AI is calculating hydro response...</span>
                </div>
              </div>
            )}
            <div ref={chatEndRef} />
          </div>

          <div style={{ display: 'flex', gap: '0.4rem', flexWrap: 'wrap' }}>
            {KISAN_PROMPTS.map((p, idx) => (
              <button key={idx} className="preset-chip" onClick={() => handleSendMessage(p.replace(/^[^a-zA-Z0-9]+/, ''))}>
                <Sparkles size={14} color="var(--accent-primary)" />
                <span>{p}</span>
              </button>
            ))}
          </div>

          <div className="chat-input-box">
            <textarea 
              className="chat-textarea" 
              placeholder="Ask Kisan AI any water, farm, or borewell question... (Press Enter to send)" 
              value={input} 
              onChange={e => setInput(e.target.value)} 
              onKeyDown={handleKeyDown} 
            />
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <span style={{ fontSize: '0.78rem', color: 'var(--text-muted)', fontWeight: '600' }}>AI Ground & Rainwater Helper</span>
              <button className="action-btn primary" onClick={onSend} disabled={!input.trim() || isGenerating}>
                <Send size={16} />
                <span>Send</span>
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // MAIN ROOT APPLICATION COMPONENT
    // ==========================================
    const MainApp = () => {
      const { appMode, activeTab } = useApp();

      return (
        <div className="app-container">
          <Sidebar />
          <main className="main-workspace">
            <Header />
            <div className="tab-content">
              {/* Academic Suite Tabs */}
              {appMode === 'academic' && (
                <>
                  {activeTab === 'dashboard' && <AcademicDashboard />}
                  {activeTab === 'survey' && <FieldSurveyAudit />}
                  {activeTab === 'calc' && <HydroCalculationEngine />}
                  {activeTab === 'schematic' && <SystemSchematicView />}
                  {activeTab === 'cost' && <CostRoiView />}
                  {activeTab === 'iot' && <SmartIotView />}
                  {activeTab === 'report' && <SynopsisDocsView />}
                </>
              )}

              {/* Farmer & Dealer Suite Tabs */}
              {appMode === 'farmer' && (
                <>
                  {activeTab === 'farmer_calc' && <FarmerCalculatorView />}
                  {activeTab === 'dealer_quote' && <DealerQuoteView />}
                  {activeTab === 'kisan_ai' && <KisanAIChatView />}
                </>
              )}
            </div>
          </main>

          {/* Account & Profile Modals */}
          <AuthModal />
          <ProfileModal />
          <ProjectsModal />
        </div>
      );
    };

    const Root = () => (
      <AppProvider>
        <MainApp />
      </AppProvider>
    );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Root />);
  </script>
</body>
</html>
